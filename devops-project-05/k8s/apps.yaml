apiVersion: v1
kind: Secret
metadata:
  name: voting-db
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: REPLACE_ME
  POSTGRES_DB: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels: { app.kubernetes.io/name: vote, app.kubernetes.io/part-of: devops-project-05 }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: vote }
  template:
    metadata:
      labels: { app.kubernetes.io/name: vote }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: vote
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-05-vote:latest
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: REDIS_HOST, value: redis }
            - { name: OPTION_A, value: Cats }
            - { name: OPTION_B, value: Dogs }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: vote
spec:
  selector: { app.kubernetes.io/name: vote }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels: { app.kubernetes.io/name: result, app.kubernetes.io/part-of: devops-project-05 }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: result }
  template:
    metadata:
      labels: { app.kubernetes.io/name: result }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: result
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-05-result:latest
          ports: [{ name: http, containerPort: 4000 }]
          env:
            - { name: POSTGRES_HOST, value: db }
          envFrom:
            - secretRef: { name: voting-db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: result
spec:
  selector: { app.kubernetes.io/name: result }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: devops-project-05 }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-05-worker:latest
          env:
            - { name: POSTGRES_HOST, value: db }
            - { name: REDIS_HOST, value: redis }
          envFrom:
            - secretRef: { name: voting-db }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }

apiVersion: v1
kind: Service
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: catalog-db
  ports:
    - { name: mysql, port: 3306, targetPort: mysql }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-db
  namespace: retail-store
spec:
  serviceName: catalog-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-db
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - name: MARIADB_DATABASE
              valueFrom: { configMapKeyRef: { name: retail-config, key: CATALOG_DB_NAME } }
            - name: MARIADB_USER
              valueFrom: { configMapKeyRef: { name: retail-config, key: CATALOG_DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: CATALOG_DB_PASSWORD } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: CATALOG_DB_ROOT_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
---

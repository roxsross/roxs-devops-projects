apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: retail-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ui
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: retail-store
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: devops-project-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ui
          image: ghcr.io/roxsross/roxs-devops-projects/retail-ui:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0
            - name: ENDPOINTS_CATALOG
              value: http://catalog:8080
            - name: ENDPOINTS_CARTS
              value: http://carts:8080
            - name: ENDPOINTS_ORDERS
              value: http://orders:8080
            - name: ENDPOINTS_CHECKOUT
              value: http://checkout:8080
            - name: ENDPOINTS_ASSETS
              value: http://assets:8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ui
  namespace: retail-store
spec:
  rules:
    - host: retail-store.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ui
  namespace: retail-store
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ui
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

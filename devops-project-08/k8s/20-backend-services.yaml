spec:
  selector:
    app.kubernetes.io/name: orders
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: retail-store
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: devops-project-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orders
          image: ghcr.io/roxsross/roxs-devops-projects/retail-orders:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0
            - name: SPRING_PROFILES_ACTIVE
              value: mysql,rabbitmq
            - name: ORDERS_DB_NAME
              valueFrom: { configMapKeyRef: { name: retail-config, key: ORDERS_DB_NAME } }
            - name: SPRING_DATASOURCE_WRITER_URL
              value: jdbc:mariadb://orders-db:3306/$(ORDERS_DB_NAME)
            - name: SPRING_DATASOURCE_READER_URL
              value: jdbc:mariadb://orders-db:3306/$(ORDERS_DB_NAME)
            - name: SPRING_DATASOURCE_WRITER_USERNAME
              valueFrom: { configMapKeyRef: { name: retail-config, key: ORDERS_DB_USER } }
            - name: SPRING_DATASOURCE_READER_USERNAME
              valueFrom: { configMapKeyRef: { name: retail-config, key: ORDERS_DB_USER } }
            - name: SPRING_DATASOURCE_WRITER_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: ORDERS_DB_PASSWORD } }
            - name: SPRING_DATASOURCE_READER_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: ORDERS_DB_PASSWORD } }
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom: { configMapKeyRef: { name: retail-config, key: RABBITMQ_USER } }
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: RABBITMQ_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---

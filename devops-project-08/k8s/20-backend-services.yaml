apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail-store
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail-store
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: devops-project-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: catalog
          image: ghcr.io/roxsross/roxs-devops-projects/retail-catalog:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: GIN_MODE
              value: release
            - name: DB_ENDPOINT
              value: catalog-db:3306
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: retail-config, key: CATALOG_DB_NAME } }
            - name: DB_USER
              valueFrom: { configMapKeyRef: { name: retail-config, key: CATALOG_DB_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: retail-secrets, key: CATALOG_DB_PASSWORD } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: carts
  namespace: retail-store
spec:
  selector:
    app.kubernetes.io/name: carts
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carts
  namespace: retail-store
  labels:
    app.kubernetes.io/name: carts
    app.kubernetes.io/part-of: devops-project-08
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: carts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carts
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: carts
          image: ghcr.io/roxsross/roxs-devops-projects/retail-cart:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: JAVA_OPTS
              value: -XX:MaxRAMPercentage=75.0
            - name: SPRING_PROFILES_ACTIVE
              value: dynamodb
            - name: CARTS_DYNAMODB_ENDPOINT
              value: http://carts-db:8000
            - name: CARTS_DYNAMODB_CREATETABLE
              value: "true"
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: retail-config, key: AWS_REGION } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: retail-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: retail-secrets, key: AWS_SECRET_ACCESS_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: orders

apiVersion: v1
kind: Secret
metadata:
  name: devops-09-secret
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: devops-09-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: devops-project-09
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: devops-project-09
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: devops-project-09
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 256Mi }
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 20
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-09-web
  labels:
    app.kubernetes.io/name: devops-09-web
    app.kubernetes.io/part-of: devops-project-09
spec:
  # SQLite en un volumen RWO: una sola réplica.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: devops-09-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devops-09-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-09:latest
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: DATABASE_URL
              value: sqlite:////app/data/devops.db
            - name: REDIS_HOST
              value: redis
            - name: LOG_TO_FILE
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: devops-09-secret
                  key: SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: devops-09-data
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: devops-09-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: devops-09-web
  ports:
    - name: http
      port: 80
      targetPort: http

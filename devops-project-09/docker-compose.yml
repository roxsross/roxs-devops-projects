services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-project-09:local
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me}
      DATABASE_URL: sqlite:////app/data/devops.db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: "false"
    ports:
      - "${WEB_PORT:-8009}:8080"
    volumes:
      - web_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [ app ]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [ app ]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

networks:
  app:
    driver: bridge

volumes:
  web_data:
  redis_data:

apiVersion: v1
kind: Secret
metadata:
  name: tetris-secret
type: Opaque
stringData:
  SECRET_KEY: change-me-in-production
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tetris-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetris
  labels:
    app.kubernetes.io/name: tetris
    app.kubernetes.io/part-of: devops-project-07
spec:
  # SQLite + estado de partidas en memoria: el juego no es escalable horizontalmente.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tetris
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tetris
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tetris
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-07:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_FILENAME
              value: /app/data/tetris.db
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tetris-secret
                  key: SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /app/data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tetris-data
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: tetris
spec:
  type: ClusterIP
  # WebSocket: las conexiones deben mantenerse contra el mismo pod.
  sessionAffinity: ClientIP
  selector:
    app.kubernetes.io/name: tetris
  ports:
    - name: http
      port: 80
      targetPort: http

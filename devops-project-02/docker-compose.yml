services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-project-02:local
    container_name: django-hello-world
    env_file:
      - .env
    ports:
      - "8002:8000"
    volumes:
      - django_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  django_data:

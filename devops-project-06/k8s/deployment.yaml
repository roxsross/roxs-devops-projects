apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-weather-app
  labels:
    app.kubernetes.io/name: react-weather-app
    app.kubernetes.io/part-of: devops-project-06
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: react-weather-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: react-weather-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-06:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: react-weather-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: react-weather-app
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db
type: Opaque
stringData:
  MYSQL_USER: petclinic
  MYSQL_PASS: REPLACE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/part-of: devops-project-04
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: petclinic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: petclinic
          image: ghcr.io/roxsross/roxs-devops-projects/devops-project-04:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: mysql
            - name: MYSQL_URL
              value: jdbc:mysql://mysql:3306/petclinic
          envFrom:
            - secretRef:
                name: petclinic-db
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: petclinic
  ports:
    - name: http
      port: 80
      targetPort: http

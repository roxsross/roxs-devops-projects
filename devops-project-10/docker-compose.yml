services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-project-10:local
    environment:
      PORT: 8080
    ports:
      - "${WEB_PORT:-8010}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
